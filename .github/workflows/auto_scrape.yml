name: Weekly Scrape and Update Data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Jalankan Pipeline Analytics (Scrape -> Clean -> Sentiment)
      run: |
        python main.py

    - name: Commit & Push Data Baru ke GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/
        git commit -m "Auto-update: Data ulasan pelabuhan mingguan" || echo "Tidak ada data baru untuk di-commit"
        git push
